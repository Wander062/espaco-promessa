<style>
:root {
  --rose: #f5e5e9;
  --ink: #171313;
  --gold: #b99a54;
  --gold-deep: #947541;
  --muted: #4e4748;
  --paper: #fbf7f6;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--paper);
  color: var(--ink);
  font-family: Outfit, "Segoe UI", sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px 16px;
}
.card {
  width: min(720px, 100%);
  background: var(--rose);
  border: 1px solid var(--gold);
  border-radius: 18px;
  padding: 44px 48px 36px;
  text-align: center;
}
h1, h2, .route-label {
  font-family: "Cormorant Garamond", Georgia, serif;
  font-weight: 600;
}
h1 {
  margin: 0;
  font-size: clamp(30px, 4.2vw, 40px);
  letter-spacing: 0.08em;
  line-height: 1.05;
}
.tagline {
  margin: 16px 0 0;
  color: var(--gold-deep);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.16em;
  line-height: 1.5;
}
.rule {
  height: 1px;
  margin: 26px 0 30px;
  background: var(--gold);
  border: 0;
}
h2 {
  margin: 0 0 12px;
  font-size: clamp(24px, 3vw, 30px);
  letter-spacing: 0.01em;
}
.intro {
  margin: 0 auto 26px;
  max-width: 46ch;
  color: var(--muted);
  font-size: 16px;
  line-height: 1.6;
}
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 54px;
  padding: 14px 16px;
  border-radius: 10px;
  text-decoration: none;
  font-size: clamp(12px, 1.6vw, 14px);
  font-weight: 600;
  letter-spacing: 0.1em;
  line-height: 1.3;
  text-transform: uppercase;
}
.btn:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 3px;
}
.btn-map {
  background: var(--gold);
  color: #fff;
}
.btn-map:hover { background: #a88a45; }
.route-label {
  margin: 28px 0 8px;
  font-size: 22px;
}
.route {
  margin: 0;
  color: var(--muted);
  font-size: 15px;
  letter-spacing: 0.01em;
}
.btn-wa {
  margin-top: 26px;
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--gold);
}
.btn-wa:hover { background: rgba(185, 154, 84, 0.14); }
@media (max-width: 640px) {
  body { padding: 16px 12px; align-items: flex-start; }
  .card { padding: 32px 20px 24px; border-radius: 16px; }
  .tagline { letter-spacing: 0.1em; font-size: 11px; }
  .rule { margin: 22px 0 24px; }
  .intro { font-size: 15px; }
  .route-label { margin-top: 24px; }
}
</style>
</head>

<main class="card">
